<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Copy lives in src/data/content.js (PRD R31). <title> is set from there on boot;
     this value is only what shows before the module runs. -->
<title>Jingwen Bakery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;700&display=swap">

<!-- No leading slashes anywhere. A leading slash resolves to the domain root and
     404s on a GitHub Pages project site (PRD §10.3). -->
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/scenes.css">
<link rel="stylesheet" href="src/styles/ui.css">
<link rel="stylesheet" href="src/styles/panel.css">
</head>

<!-- data-time is replaced on boot from the visitor's clock. The value here only
     prevents a flash of untinted scene before the module runs. -->
<body data-time="noon">

<!-- Layer order is fixed by PRD §9 and design.md. Stacking comes from the --z-* tokens
     in tokens.css; never add a bare z-index. The elements are static, the contents are
     filled in by src/engine/renderer.js from src/data/. -->
<div class="stage" id="stage">
  <div class="layer layer--sky"      id="sky"      aria-hidden="true"></div>

  <!-- Two backdrops so a time change can cross-fade instead of hard-cutting (R30).
       The renderer alternates which one is on top.

       Each is a slot rather than a bare <img>: the image is fitted small, to read as
       distant, and a blurred copy of itself fills the space around it so it does not
       end on a visible rectangle. See scenes.css. -->
  <!-- Three copies of the same file, side by side, with the outer two mirrored. The
       middle one is the landmark; the mirrors exist only to carry the sky and the
       distant land out past the edges of the screen. Same URL, so one download. -->
  <div class="layer layer--backdrop" id="backdrop-a" aria-hidden="true">
    <div class="backdrop__strip">
      <img class="backdrop__image backdrop__image--mirror" alt="" decoding="async">
      <img class="backdrop__image" alt="" decoding="async">
      <img class="backdrop__image backdrop__image--mirror" alt="" decoding="async">
    </div>
  </div>
  <div class="layer layer--backdrop" id="backdrop-b" aria-hidden="true" hidden>
    <div class="backdrop__strip">
      <img class="backdrop__image backdrop__image--mirror" alt="" decoding="async">
      <img class="backdrop__image" alt="" decoding="async">
      <img class="backdrop__image backdrop__image--mirror" alt="" decoding="async">
    </div>
  </div>

  <div class="layer layer--tint"     id="tint"     aria-hidden="true"></div>
  <img class="layer layer--scene"    id="scene"    alt="" decoding="async">
  <div class="layer layer--props"    id="props"></div>

  <!-- The five table buttons have their own layer, separate from the signs, because
       the two need different treatment on a phone. Sharing the signs' layer meant
       the tables were dragged into the signs' corner dock by a rule written for
       signs, and landed at viewport percentages that mean nothing. Both layers do
       dock below 8:5, but each to its own place — see ui.css.

       NOT aria-hidden, unlike the decor layer below: these are real controls. -->
  <div class="layer layer--tables"   id="tables"></div>

  <div class="layer layer--decor"    id="decor" aria-hidden="true"></div>
  <div class="layer layer--actors"   id="actors"></div>

  <!-- Chrome. Sits above the time-of-day tint, so it is never dimmed by the night
       wash — that would be a bug, not a mood. -->
  <div class="layer layer--ui" id="ui"></div>
</div>

<!-- The overlay panel a table opens. Outside .stage deliberately: the stage gets
     `inert` while a panel is open, and a panel nested inside it would inert itself.
     Empty here — src/engine/panel.js fills it, because copy lives in content.js. -->
<div class="panel" id="panel" hidden>
  <div class="panel__scrim" data-close></div>
  <div class="panel__card" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <header class="panel__bar">
      <h2 class="panel__title" id="panel-title"></h2>
      <button class="panel__close" type="button" data-close></button>
    </header>
    <!-- tabindex="0" makes the scrolling region reachable by keyboard. Without it
         the body is not focusable, the arrow keys go to the focused close button
         instead, and a keyboard-only user cannot read past the fold of a long
         panel — WCAG 2.1.1. It is also the standard technique for a scroll
         container that holds no other focusable element. -->
    <div class="panel__body" id="panel-body" tabindex="0"></div>
  </div>
</div>

<!-- The photo lightbox. A SIBLING of the panel, not a child: the panel's focus trap
     queries its own subtree, so a lightbox nested inside would be caught by that trap
     and by the panel's Escape handler at the same time. Kept out here, it owns its
     own trap and closes on its own Escape. src/engine/lightbox.js fills it. -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__scrim" data-lightbox-close></div>
  <div class="lightbox__frame" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
    <!-- Close comes FIRST in the DOM even though it is styled into the top-right
         corner. That corner is above the arrows on screen, so first in the markup is
         what makes the tab order match the reading order. Placed last, Tab went
         prev, next, close — the way out was the last thing a keyboard user found. -->
    <button class="lightbox__close" id="lightbox-close" type="button" data-lightbox-close></button>
    <img class="lightbox__image" id="lightbox-image" alt="">
    <p class="lightbox__caption" id="lightbox-caption"></p>
    <div class="lightbox__controls">
      <button class="lightbox__nav" id="lightbox-prev" type="button"></button>
      <span class="lightbox__count" id="lightbox-count"></span>
      <button class="lightbox__nav" id="lightbox-next" type="button"></button>
    </div>
  </div>
</div>

<script type="module" src="src/engine/main.js"></script>
</body>
</html>
